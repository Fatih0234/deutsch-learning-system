schema_version: 1

structures:
  - id: je-desto
    pattern: "je ..., desto ..."
    status: practicing
    rule: >
      Im je-Satz steht das finite Verb am Ende.
      Der desto-Satz beginnt typischerweise mit dem Vergleichselement.
    examples:
      - "Je mehr ich spreche, desto leichter fällt mir Deutsch."
      - "Je häufiger ich übe, desto natürlicher fühlt es sich an."
    attempts: 2
    successful_uses: 1
    first_seen: 2026-10-02
    last_seen: 2026-10-02

  - id: reflexive-sich-anfuehlen
    pattern: "sich anfühlen"
    status: practicing
    rule: >
      "sich anfühlen" ist reflexiv. Für die betroffene Person wird oft
      "für + Akkusativ" verwendet.
    examples:
      - "Das fühlt sich gut an."
      - "Das fühlt sich für mich natürlicher an."
    attempts: 2
    successful_uses: 0
    first_seen: 2026-10-02
    last_seen: 2026-10-02

  - id: egal-ob
    pattern: "Egal, ob ... oder ...: ..."
    status: practicing
    rule: >
      "ob" leitet einen Nebensatz ein; das finite Verb steht am Ende.
      Mit "egal, ob A oder B" sagt man, dass das Ergebnis in beiden Fällen gilt.
    examples:
      - "Egal, ob ich zu Hause arbeite oder ins Büro fahre: Ich beginne um neun."
      - "Egal, ob du Anfänger bist oder schon Erfahrung hast: Übung hilft."
    attempts: 0
    successful_uses: 0
    first_seen: 2026-10-03
    last_seen: 2026-10-03
